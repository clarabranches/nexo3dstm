<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão Nexo 3D">
    <title>Nexo 3D - Gestão</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ======== TELA DE LOGIN ======== -->
    <section id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <span>NEXO</span>
                <strong>3D</strong>
            </div>
            <h1>Bem-vindo</h1>
            <p class="login-subtitle">Sistema de gestão Nexo 3D</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">E-mail</label>
                    <input type="email" id="login-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" placeholder="Sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Entrar</button>
                <p id="login-message" class="form-message"></p>
            </form>
        </div>
    </section>

    <!-- ======== SISTEMA ======== -->
    <div id="app" class="app hidden">
        <!-- MENU LATERAL -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-name">NEXO <span>3D</span></div>
                <small>Gestão de Produção</small>
            </div>
            <nav class="sidebar-menu">
                <button class="menu-item active" data-tab="dashboard">
                    <span class="menu-icon"></span>
                    <span>Visão geral</span>
                </button>
                <button class="menu-item" data-tab="produtos">
                    <span class="menu-icon"></span>
                    <span>Produtos</span>
                </button>
                <button class="menu-item" data-tab="cadastro">
                    <span class="menu-icon">+</span>
                    <span>Cadastrar produto</span>
                </button>
                <button class="menu-item" data-tab="configuracoes">
                    <span class="menu-icon"></span>
                    <span>Configurações</span>
                </button>
            </nav>
            <div class="sidebar-bottom">
                <div class="user-info">
                    <div class="user-avatar">U</div>
                    <div>
                        <strong id="user-email">Usuário</strong>
                        <small>Acesso autorizado</small>
                    </div>
                </div>
                <button id="logout-button" class="logout-button">Sair</button>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="main-content">
            <!-- CABEÇALHO -->
            <header class="topbar">
                <div>
                    <h1 id="page-title">Visão geral</h1>
                    <p id="page-subtitle">Acompanhe os produtos e a produção.</p>
                </div>
                <button class="mobile-menu-button" id="mobile-menu-button"></button>
            </header>

            <!-- ABA 1 - DASHBOARD -->
            <section id="tab-dashboard" class="tab-content active">
                <div class="welcome-card">
                    <div>
                        <span class="eyebrow">NEXO 3D</span>
                        <h2>Controle sua produção de forma simples.</h2>
                        <p>Cadastre
